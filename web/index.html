<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#232527" />
  <meta name="description" content="Construye, explora y juega con amigos en la web y en tu Nintendo 3DS." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Blocksy" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <title>Blocksy</title>
</head>
<body>
  <main id="auth" class="hidden">
    <div class="auth-card">
      <div class="logo big"><span class="logo-mark"></span>Blocksy</div>
      <p class="tagline" data-i18n="tagline"></p>
      <div class="tabs" id="auth-tabs"><button class="tab active" data-mode="login" data-i18n="login"></button><button class="tab" data-mode="signup" data-i18n="signup"></button></div>
      <form id="auth-form">
        <input id="username" data-i18n-ph="username" pattern="[A-Za-z0-9_]{3,20}" data-i18n-title="username_hint" autocomplete="username" class="hidden" />
        <input id="email" type="email" data-i18n-ph="email" required autocomplete="email" />
        <input id="password" type="password" data-i18n-ph="password" required minlength="6" autocomplete="current-password" />
        <button class="btn primary wide" id="auth-submit" data-i18n="login"></button>
        <p id="auth-msg" class="msg"></p>
      </form>
      <select id="auth-lang" aria-label="Language"></select>
    </div>
  </main>

  <div id="app" class="hidden">
    <header id="topbar">
      <button id="burger" class="icon-btn" aria-label="Menu"><i data-icon="menu" data-size="24"></i></button>
      <div class="logo"><span class="logo-mark"></span><span class="logo-text">Blocksy</span></div>
      <nav id="topnav"><a href="/home" data-i18n="nav_home"></a><a href="/discover" data-i18n="nav_discover"></a><a href="/create" id="topnav-create" class="hidden" data-i18n="nav_create"></a></nav>
      <form id="search" autocomplete="off"><input id="search-input" data-i18n-ph="search_games" /></form>
      <a id="coins" class="coin-chip" href="/shop"></a>
      <button id="bell" class="bell-btn" data-i18n-title="notifications"><i data-icon="bell" data-size="22"></i><span id="bell-count" class="badge hidden"></span></button>
      <div id="userchip"><span id="chip-avatar" class="avatar sm"></span><span id="chip-name"></span></div>
      <div id="notif-panel" class="hidden"></div>
    </header>
    <aside id="sidebar">
      <a href="/home" data-page="home"><i data-icon="home"></i><span data-i18n="nav_home"></span></a>
      <a href="/discover" data-page="discover"><i data-icon="compass"></i><span data-i18n="nav_discover"></span></a>
      <a href="/profile" data-page="profile"><i data-icon="user"></i><span data-i18n="nav_profile"></span></a>
      <a href="/avatar" data-page="avatar"><i data-icon="emote"></i><span data-i18n="nav_avatar"></span></a>
      <a href="/friends" data-page="friends"><i data-icon="users"></i><span data-i18n="nav_friends"></span><b id="friends-badge" class="badge inline hidden"></b></a>
      <a href="/shop" data-page="shop"><i data-icon="shop"></i><span data-i18n="nav_shop"></span></a>
      <a href="/link" data-page="link"><i data-icon="device"></i><span data-i18n="nav_link"></span></a>
      <a href="/create" data-page="create" id="nav-create" class="hidden"><i data-icon="plus"></i><span data-i18n="nav_create"></span></a>
      <a href="/settings" data-page="settings"><i data-icon="sliders"></i><span data-i18n="nav_settings"></span></a>
      <div class="spacer"></div>
      <button id="logout" class="side-btn"><i data-icon="logout"></i><span data-i18n="nav_logout"></span></button>
    </aside>
    <main id="page"></main>
  </div>

  <div id="modal" class="hidden"><div id="modal-card"></div></div>
  <div id="toast" class="hidden"></div>
  <div id="popups"></div>
  <div id="update-bar" class="hidden"><span data-i18n="update_available"></span><button class="btn blue" id="update-reload" data-i18n="update_now"></button><button class="btn" id="update-later" data-i18n="update_later"></button></div>

  <div id="game" class="hidden">
    <canvas id="view"></canvas>
    <div id="crosshair"></div>
    <div id="ui-layer"></div>
    <div id="big-title" class="hidden"></div>
    <div id="studio-bar" class="hidden">
      <button id="st-place" class="st-btn on" data-i18n-title="st_place"><i data-icon="plus"></i><span data-i18n="st_place"></span></button>
      <button id="st-erase" class="st-btn" data-i18n-title="st_erase"><i data-icon="trash"></i><span data-i18n="st_erase"></span></button>
      <button id="st-ui" class="st-btn" data-i18n-title="st_ui"><i data-icon="edit"></i><span data-i18n="st_ui"></span></button>
      <button id="st-addtext" class="st-btn" data-i18n-title="st_addtext"><i data-icon="chat"></i><span data-i18n="st_addtext"></span></button>
      <button id="st-script" class="st-btn" data-i18n-title="ed_script"><i data-icon="code"></i><span data-i18n="ed_script"></span></button>
      <button id="st-test" class="st-btn" data-i18n-title="st_test"><i data-icon="play"></i><span data-i18n="st_test"></span></button>
      <button id="st-save" class="st-btn primary" data-i18n-title="save"><i data-icon="check"></i><span data-i18n="save"></span></button>
      <button id="st-exit" class="st-btn" data-i18n-title="close"><i data-icon="back"></i><span data-i18n="close"></span></button>
    </div>
    <div id="ui-inspector" class="hidden"></div>
    <canvas id="minimap" width="128" height="128"></canvas>
    <div id="hud-top">
      <button id="menu-btn" class="hud-btn" aria-label="Menu"><i data-icon="menu"></i></button>
      <span id="stats"></span>
      <button id="music-btn" class="hud-btn hidden" aria-label="Music"></button>
      <button id="voice-btn" class="hud-btn" data-i18n-title="voice_chat"><i data-icon="mic"></i></button>
      <button id="shot-btn" class="hud-btn" data-i18n-title="screenshot"><i data-icon="camera"></i></button>
      <button id="chat-btn" class="hud-btn" aria-label="Chat"><i data-icon="chat"></i></button>
      <button id="emote-btn" class="hud-btn" aria-label="Emotes"><i data-icon="emote"></i></button>
      <button id="players-btn" class="hud-btn" aria-label="Players"><i data-icon="users"></i></button>
    </div>
    <div id="music-panel" class="hidden">
      <div id="music-title"></div>
      <div class="music-ctl"><button id="music-prev" class="hud-btn"></button><button id="music-toggle" class="hud-btn"></button><button id="music-next" class="hud-btn"></button></div>
    </div>
    <div id="emote-panel" class="hidden"></div>
    <ul id="roster" class="hidden"></ul>
    <div id="chat">
      <ul id="chat-log"></ul>
      <form id="chat-form"><input id="chat-input" maxlength="200" autocomplete="off" enterkeyhint="send" /></form>
    </div>
    <div id="hotbar"></div>
    <div id="pause" class="hidden">
      <div class="pause-card">
        <h2 id="pause-title"></h2>
        <button class="btn primary wide" id="resume" data-i18n="resume"></button>
        <div class="pause-grid">
          <button class="btn" id="invite-btn"><span data-i18n="invite_friends"></span></button>
          <button class="btn" id="copy-link"><span data-i18n="copy_link"></span></button>
        </div>
        <label class="field"><span data-i18n="set_sens"></span> <input id="set-sens" type="range" min="0.3" max="2.5" step="0.1" /></label>
        <label class="field"><span data-i18n="set_dist"></span> <input id="set-dist" type="range" min="30" max="250" step="10" /></label>
        <label class="field"><span data-i18n="set_fov"></span> <input id="set-fov" type="range" min="50" max="100" step="1" /></label>
        <label class="field"><span data-i18n="set_quality"></span>
          <select id="set-quality"><option value="low" data-i18n="q_low"></option><option value="med" data-i18n="q_med"></option><option value="high" data-i18n="q_high"></option><option value="ultra" data-i18n="q_ultra"></option></select></label>
        <label class="field"><span data-i18n="set_music_vol"></span> <input id="set-music-vol" type="range" min="0" max="1" step="0.05" /></label>
        <div class="pause-checks">
          <label class="field check"><input id="set-music" type="checkbox" /> <span data-i18n="set_music"></span></label>
          <label class="field check"><input id="set-names" type="checkbox" /> <span data-i18n="set_names"></span></label>
          <label class="field check"><input id="set-bubbles" type="checkbox" /> <span data-i18n="set_bubbles"></span></label>
          <label class="field check"><input id="set-minimap" type="checkbox" /> <span data-i18n="set_minimap"></span></label>
          <label class="field check"><input id="set-clouds" type="checkbox" /> <span data-i18n="set_clouds"></span></label>
          <label class="field check"><input id="set-shadows" type="checkbox" /> <span data-i18n="set_shadows"></span></label>
        </div>
        <button class="btn wide" id="voice-leave" data-i18n="voice_leave"></button>
        <button class="btn danger wide" id="leave" data-i18n="leave_game"></button>
        <p class="hint" data-i18n="controls_help"></p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
