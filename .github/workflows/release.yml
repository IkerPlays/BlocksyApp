name: Stable release

# Builds Blocksy and publishes a normal (non pre-release) GitHub release : the 3DS app can detect it.
# Run it by hand : Actions > "Stable release" > Run workflow, and type the version (for example 1.0.0).
# The notes come from STABLE_RELEASE_NOTES.md : edit that file (English, plain text) BEFORE running it.
# Devbuilds are NOT affected : they are published by hand with build.yml (Run workflow), not on every push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as MAJOR.MINOR.PATCH (for example 1.0.0)"
        required: true
        type: string
      draft:
        description: "Publish as a draft first (review it on GitHub, then press Publish)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write # needed to publish the release

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch (selected: $GITHUB_REF)."
            exit 1
          fi
          version="${INPUT_VERSION#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 1.0.0 (got '$INPUT_VERSION')."
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release v$version already exists. Delete it first or pick another version."
            exit 1
          fi
          if [ ! -s STABLE_RELEASE_NOTES.md ]; then
            echo "::error::STABLE_RELEASE_NOTES.md is missing or empty."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: la versión del título del .cia es el nº de commits

      - name: System tools
        run: |
          apt-get update
          apt-get install -y git make cmake g++ gcc

      # pkg.devkitpro.org a veces rechaza (403) a los runners durante muchos minutos: las librerías se guardan en caché tras la primera instalación buena
      - name: Cache 3DS libraries
        id: dkpcache
        uses: actions/cache@v4
        with:
          path: /opt/devkitpro/portlibs/3ds
          key: dkp-3ds-libs-v1

      - name: Install 3DS libraries (curl, mbedtls, zlib)
        if: steps.dkpcache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            dkp-pacman -Sy --noconfirm 3ds-curl 3ds-mbedtls 3ds-zlib && exit 0
            echo "intento $i fallido; espero $((i * 30)) s"; sleep $((i * 30))
          done
          exit 1

      - name: Build makerom and bannertool
        run: |
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/ctr
          make -C /tmp/ctr/makerom deps
          make -C /tmp/ctr/makerom -j"$(nproc)"
          cp /tmp/ctr/makerom/bin/makerom /usr/local/bin/
          git clone --depth 1 https://github.com/carstene1ns/3ds-bannertool.git /tmp/bannertool
          cmake -S /tmp/bannertool -B /tmp/bannertool/b
          make -C /tmp/bannertool/b -j"$(nproc)"
          cp /tmp/bannertool/b/bannertool /usr/local/bin/

      # The version has no "-dev" suffix : the app sees it as a stable release.
      - name: Write config.h
        env:
          AUTH_URL: ${{ secrets.AUTH_SUPABASE_URL }}
          AUTH_KEY: ${{ secrets.AUTH_SUPABASE_ANON_KEY }}
          GAME_URL: ${{ secrets.GAME_SUPABASE_URL }}
          GAME_KEY: ${{ secrets.GAME_SUPABASE_ANON_KEY }}
          STORE_URL: ${{ secrets.STORE_SUPABASE_URL }}
          STORE_KEY: ${{ secrets.STORE_SUPABASE_ANON_KEY }}
        run: |
          {
            echo '#pragma once'
            echo "#define AUTH_URL \"$AUTH_URL\""
            echo "#define AUTH_ANON_KEY \"$AUTH_KEY\""
            echo "#define GAME_URL \"$GAME_URL\""
            echo "#define GAME_ANON_KEY \"$GAME_KEY\""
            echo "#define STORE_URL \"$STORE_URL\""
            echo "#define STORE_ANON_KEY \"$STORE_KEY\""
            echo '#define GAME_ID "00000000-0000-0000-0000-000000000001"'
          } > 3ds/source/config.h

      # Versión del título del .cia = nº de commits: sube en cada build (si no, el instalador de la 3DS rechaza el .cia con 0xC8E083FC)
      - name: Title version
        id: tv
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          n=$(git rev-list --count HEAD)
          [ -n "$n" ] && [ "$n" -gt 0 ] || { echo "::error::no se pudo contar los commits"; exit 1; }
          echo "Title version: $n"
          echo "n=$n" >> "$GITHUB_OUTPUT"

      - name: Build .3dsx and .cia
        working-directory: 3ds
        run: make cia MAKEROM=makerom BANNERTOOL=bannertool BLOCKSY_VERSION=${{ needs.check.outputs.version }} APP_VER=${{ steps.tv.outputs.n }}

      - name: Collect files
        run: |
          mkdir dist
          cp 3ds/blocksy.cia dist/Blocksy.cia
          cp 3ds/blocksy.3dsx dist/Blocksy.3dsx

      - uses: actions/upload-artifact@v4
        with:
          name: Blocksy-release
          path: dist/

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Blocksy-release
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          {
            echo "# Blocksy ${VERSION}"
            echo
            cat STABLE_RELEASE_NOTES.md
            echo
            echo "---"
            echo "Built from commit \`${GITHUB_SHA::7}\`. Install \`Blocksy.cia\` with FBI, or run \`Blocksy.3dsx\` from the Homebrew Launcher."
          } > notes.md
          extra=""
          if [ "$DRAFT" = "true" ]; then extra="--draft"; fi
          gh release create "v${VERSION}" dist/Blocksy.cia dist/Blocksy.3dsx \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest $extra \
            --title "Blocksy ${VERSION}" \
            --notes-file notes.md
