# Netlify con la carpeta base vacía (raíz del repo). Si en Netlify pones Base directory = web, se usa web/netlify.toml.
[build]
  base = "web"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
